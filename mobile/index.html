<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c84d16"><title>MIDIum Mobile MK3 — LIE006</title><link rel="stylesheet" href="mobile.css"></head><body><main><header><h1>MIDIum</h1><div><p>Prototype Development Copy V1.0</p><small>LIE006 / LOREM IPSUM EDITIONS</small></div></header><section class="source-panel"><label for="source">TEXT</label><textarea id="source" rows="2" spellcheck="false">ENTER some text?</textarea></section><section class="roll-panel" aria-label="Piano roll"><div class="roll-tools"><strong>PIANO ROLL</strong><span id="count"></span><button id="fit">FIT</button><label>ZOOM<input id="zoom" type="range" min=".2" max="12" step=".1" value="3"></label></div><div id="rollViewport"><div id="rollSurface"><canvas id="roll" aria-label="Text-generated notes"></canvas><div id="playhead"></div></div></div></section><div class="performance"><div class="transport"><button id="play" disabled>▶ PLAY</button><button id="stop">■ STOP</button><button id="loop" aria-pressed="true">LOOP ON</button><label class="tempo"><input id="tempo" aria-label="Tempo" type="number" min="20" max="480" value="120">BPM</label></div><label class="slider" for="volume"><span>MASTER VOLUME</span><input id="volume" type="range" min="0" max="100" step="1" value="65"><output id="volumeValue"></output></label></div><div class="readout"><span id="status" role="status">Loading…</span><span id="elapsed">00:00</span></div><nav class="tabs" aria-label="Effects"><button data-effect="sound" aria-pressed="true">SOUND</button><button data-effect="time" aria-pressed="false">TIME</button><button data-effect="texture" aria-pressed="false">TEXTURE</button><button data-effect="space" aria-pressed="false">SPACE</button><button data-effect="echo" aria-pressed="false">PITCH ECHO</button><button data-effect="harmony" aria-pressed="false">HARMONY</button></nav><section id="sound" class="effect" ><h2>SOUND</h2><div class="effect-body"><label class="slider" for="attack"><span>Attack</span><input id="attack" type="range" min="0.001" max="2" step="0.001" value="0.175"><output id="attackValue"></output></label><label class="slider" for="release"><span>Release</span><input id="release" type="range" min="0.01" max="6" step="0.01" value="1.25"><output id="releaseValue"></output></label><label class="slider" for="chorus"><span>Woozy chorus</span><input id="chorus" type="range" min="0" max="1" step="0.01" value="0"><output id="chorusValue"></output></label><label class="slider" for="pitch"><span>Pitch</span><input id="pitch" type="range" min="-12" max="12" step="0.1" value="0"><output id="pitchValue"></output></label></div></section><section id="time" class="effect" hidden><h2>TIME</h2><div class="effect-body"><label class="slider" for="speed"><span>Speed</span><input id="speed" type="range" min="0.125" max="4" step="0.025" value="1"><output id="speedValue"></output></label><label class="slider" for="reverseTime"><span>Reverse time</span><input id="reverseTime" type="range" min="0.1" max="5" step="0.01" value="0.6"><output id="reverseTimeValue"></output></label><label class="slider" for="reverse"><span>Reverse mix</span><input id="reverse" type="range" min="0" max="1" step="0.01" value="0"><output id="reverseValue"></output></label><label class="slider" for="drift"><span>Drift</span><input id="drift" type="range" min="0" max="1" step="0.01" value="0"><output id="driftValue"></output></label></div></section><section id="texture" class="effect" hidden><h2>TEXTURE</h2><div class="effect-body"><label class="slider" for="crush"><span>Crush</span><input id="crush" type="range" min="0" max="1" step="0.01" value="0"><output id="crushValue"></output></label><label class="slider" for="glitchAmount"><span>Glitch amount</span><input id="glitchAmount" type="range" min="0" max="1" step="0.01" value="0"><output id="glitchAmountValue"></output></label><label class="slider" for="glitchRate"><span>Glitch rate</span><input id="glitchRate" type="range" min="5" max="250" step="1" value="25"><output id="glitchRateValue"></output></label><button id="randomGlitch" aria-pressed="false">GLITCH RANDOM OFF</button><button id="stutter" aria-pressed="false">HOLD STUTTER · 60 ms</button><small>Hold + drag: left faster / right slower</small></div></section><section id="space" class="effect" hidden><h2>SPACE</h2><div class="effect-body"><label class="slider" for="delayTime"><span>Delay time</span><input id="delayTime" type="range" min="0.01" max="2.5" step="0.01" value="0.35"><output id="delayTimeValue"></output></label><label class="slider" for="delayMix"><span>Delay mix</span><input id="delayMix" type="range" min="0" max="1" step="0.01" value="0"><output id="delayMixValue"></output></label><label class="slider" for="feedback"><span>Feedback</span><input id="feedback" type="range" min="0" max="1" step="0.01" value="0.35"><output id="feedbackValue"></output></label><label class="slider" for="mix"><span>Reverb</span><input id="mix" type="range" min="0" max="1" step="0.01" value="0.18"><output id="mixValue"></output></label><label class="slider" for="tone"><span>Tone</span><input id="tone" type="range" min="0" max="1" step="0.01" value="0.5"><output id="toneValue"></output></label><label class="slider" for="length"><span>Length</span><input id="length" type="range" min="0.5" max="8" step="0.1" value="3.4"><output id="lengthValue"></output></label></div></section><section id="echo" class="effect" hidden><h2>PITCH ECHO</h2><div class="effect-body"><label class="select">Scale<select id="echoScale"><option value="follow">FOLLOW HARMONY</option><option value="pentatonic">PENTATONIC</option><option value="minor">MINOR</option><option value="major">MAJOR</option><option value="chromatic">CHROMATIC</option></select></label><label class="select">Interval<select id="echoInterval"><option value="octaves">OCTAVES</option><option value="fifths">FIFTHS</option><option value="thirds">THIRDS</option><option value="mixed">MIXED</option></select></label><label class="select">Pattern<select id="echoPattern"><option value="updown">UP/DOWN</option><option value="up">UP</option><option value="down">DOWN</option><option value="random">RANDOM</option></select></label><label class="slider" for="echoPitch"><span>Pitch</span><input id="echoPitch" type="range" min="-12" max="12" step="1" value="12"><output id="echoPitchValue"></output></label><label class="slider" for="echoRandom"><span>Random</span><input id="echoRandom" type="range" min="0" max="1" step="0.01" value="0"><output id="echoRandomValue"></output></label><label class="slider" for="echoFeedback"><span>Feedback</span><input id="echoFeedback" type="range" min="0" max="1" step="0.01" value="0.35"><output id="echoFeedbackValue"></output></label><label class="slider" for="dry"><span>Dry</span><input id="dry" type="range" min="0" max="1" step="0.01" value="1"><output id="dryValue"></output></label><label class="slider" for="level"><span>Echo level</span><input id="level" type="range" min="0" max="1" step="0.01" value="0"><output id="levelValue"></output></label><label class="slider" for="echoDecay"><span>Decay</span><input id="echoDecay" type="range" min="0" max="1" step="0.01" value="0.35"><output id="echoDecayValue"></output></label><label class="slider" for="echoWooze"><span>Wooze</span><input id="echoWooze" type="range" min="0" max="1" step="0.01" value="0"><output id="echoWoozeValue"></output></label><label class="slider" for="sparse"><span>Sparse</span><input id="sparse" type="range" min="0" max="1" step="0.01" value="0"><output id="sparseValue"></output></label></div></section><section id="harmony" class="effect" hidden><h2>HARMONY</h2><div class="effect-body"><label class="select">Harmony mode<select id="mode"><option value="original">ORIGINAL</option><option value="pentatonic">PENTATONIC</option><option value="minor">MINOR</option><option value="drone">DRONE</option><option value="chromatic">CHROMATIC</option></select></label><label class="slider" for="amount"><span>Harmony amount</span><input id="amount" type="range" min="0" max="1" step="0.01" value="1"><output id="amountValue"></output></label><label class="slider" for="droneLevel"><span>Drone level</span><input id="droneLevel" type="range" min="0" max="1" step="0.01" value="0.25"><output id="droneLevelValue"></output></label><label class="slider" for="droneWooze"><span>Drone wooze</span><input id="droneWooze" type="range" min="0" max="1" step="0.01" value="0"><output id="droneWoozeValue"></output></label><button id="drone" aria-pressed="false">DRONE OFF</button><label class="select">Drone note<select id="droneNote"><option value="auto">AUTO</option><option value="0">C</option><option value="1">C♯</option><option value="2">D</option><option value="3">D♯</option><option value="4">E</option><option value="5">F</option><option value="6">F♯</option><option value="7">G</option><option value="8">G♯</option><option value="9">A</option><option value="10">A♯</option><option value="11">B</option></select></label><label class="select">Octave<select id="octave"><option value="low">LOW</option><option value="mid">MID</option><option value="high">HIGH</option></select></label></div></section><section class="type-panel"><h2>TYPOGRAPHY / INSTRUMENT</h2><div class="type-grid"><label class="select">Typeface<select id="font"><option value="helvetica">Helvetica</option><option value="times">Times New Roman</option><option value="comic">Comic Sans</option></select></label><label class="select">Instrument<select id="instrument"></select></label></div><div class="style-row"><button id="bold" aria-label="Bold" aria-pressed="false"><b>B</b></button><button id="italic" aria-label="Italic" aria-pressed="false"><i>I</i></button><button id="underline" aria-label="Underline" aria-pressed="false"><u>U</u></button><label class="select">Letterform<select id="letterform"><option value="filled">FILLED</option><option value="outline">OUTLINE</option></select></label></div></section><div class="actions"><button id="randomise">RANDOMISE</button><button id="reset">RESET</button></div></main><script type="module" src="js/mobile.js?v=mobile-audio1"></script></body></html>
